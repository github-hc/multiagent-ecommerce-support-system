version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: support_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: support_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/support_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    # Run database migrations first, then start the FastAPI application
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: support_mcp_server
    ports:
      - "8001:8001"
    environment:
      - BACKEND_BASE_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
